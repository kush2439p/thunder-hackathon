name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prefix static asset paths for the project Pages URL
        run: >-
          find out -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.txt' \)
          -print0 | xargs -0 sed -i
          's#"/assets/#"/thunder-hackathon/assets/#g;
          s#"/_next/#"/thunder-hackathon/_next/#g;
          s#"/icon.svg#"/thunder-hackathon/icon.svg#g'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
